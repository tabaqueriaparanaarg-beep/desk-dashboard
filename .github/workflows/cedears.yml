name: Actualizar lista de CEDEARs (BYMA)

# Una vez por mes lee el listado público de BYMA y actualiza la marca `cedear`
# de universe.json. Si el listado cambió, commitea en main. Un push hecho con
# el token de Actions no dispara otros workflows: la marca nueva se publica en
# la próxima corrida programada del deploy (cada 30 min o al cierre). Si BYMA
# cambia el formato del PDF, el script aborta sin tocar nada y esta corrida
# queda en rojo para revisarla.
on:
  workflow_dispatch:
  schedule:
    # Día 2 de cada mes, 15:13 UTC = 12:13 ART.
    - cron: "13 15 2 * *"

permissions:
  contents: write

concurrency:
  group: cedears
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar pypdf (solo para este script)
        run: |
          python -m pip install --upgrade pip
          pip install pypdf

      - name: Leer el listado de BYMA y actualizar universe.json
        run: python actualizar_cedears.py

      - name: Tests
        run: python -m unittest discover -s . -p 'test_*.py'

      - name: Commitear si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add universe.json
          if git diff --cached --quiet; then
            echo "La lista de CEDEARs no cambió."
            exit 0
          fi
          git commit -m "Actualiza la lista de CEDEARs de BYMA"
          git push origin HEAD:main
